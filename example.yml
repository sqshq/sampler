runcharts:
  - title: Search engine response time
    position: [[0, 0], [45, 19]]
    rate-ms: 500
    triggers:
      - title: Latency threshold exceeded
        condition: echo "$prev < 0.8 && $cur > 0.8" |bc -l
        actions:
            terminal-bell: true
            sound: true
            visual: true
            script: 'which say >/dev/null 2>&1 && say alert: ${label} latency exceeded ${cur} second || true'
    legend:
        enabled: true
        details: false
    scale: 2
    items:
      - label: GOOGLE
        color: 178
        sample: curl -o /dev/null -s -w '%{time_total}'  https://www.google.com
      - label: YAHOO
        sample: curl -o /dev/null -s -w '%{time_total}'  https://search.yahoo.com
      - label: BING
        sample: curl -o /dev/null -s -w '%{time_total}'  https://www.bing.com
barcharts:
  - title: Local network activity
    position: [[45, 20], [35, 8]]
    rate-ms: 500
    scale: 0
    items:
      - label: UDP bytes in
        sample: which nettop >/dev/null 2>&1 && nettop -J bytes_in -l 1 -m udp | awk '{sum += $4} END {print sum}' || awk 'NR>2 {rx+=$2} END {print rx}' /proc/net/dev
      - label: UDP bytes out
        sample: which nettop >/dev/null 2>&1 && nettop -J bytes_out -l 1 -m udp | awk '{sum += $4} END {print sum}' || awk 'NR>2 {tx+=$10} END {print tx}' /proc/net/dev
      - label: TCP bytes in
        sample: which nettop >/dev/null 2>&1 && nettop -J bytes_in -l 1 -m tcp | awk '{sum += $4} END {print sum}' || awk 'NR>2 {rx+=$2} END {print rx}' /proc/net/dev
      - label: TCP bytes out
        sample: which nettop >/dev/null 2>&1 && nettop -J bytes_out -l 1 -m tcp | awk '{sum += $4} END {print sum}' || awk 'NR>2 {tx+=$10} END {print tx}' /proc/net/dev
gauges:
  - title: YEAR PROGRESS
    position: [[45, 0], [35, 2]]
    cur:
        sample: date +%j
    max:
        sample: echo 365
    min:
        sample: echo 0
  - title: DAY PROGRESS
    position: [[45, 3], [35, 2]]
    cur:
        sample: date +%H
    max:
        sample: echo 24
    min:
        sample: echo 0
  - title: HOUR PROGRESS
    position: [[45, 6], [35, 2]]
    cur:
        sample: date +%M
    max:
        sample: echo 60
    min:
        sample: echo 0
  - title: MINUTE PROGRESS
    position: [[45, 9], [35, 2]]
    triggers:
      - title: CLOCK BELL EVERY MINUTE
        condition: '[ $label == "cur" ] && [ $cur -eq 0 ] && echo 1 || echo 0'
        actions:
            sound: true
            script: which say >/dev/null 2>&1 && say -v samantha `date +%I:%M%p` || true
    cur:
        sample: date +%S
    max:
        sample: echo 60
    min:
        sample: echo 0
sparklines:
  - title: CPU usage
    position: [[0, 20], [22, 8]]
    rate-ms: 200
    scale: 0
    sample: ps -A -o %cpu | awk '{s+=$1} END {print s}'
  - title: Free memory pages
    position: [[22, 20], [23, 8]]
    rate-ms: 200
    scale: 0
    sample: which memory_pressure >/dev/null 2>&1 && memory_pressure | grep 'Pages free' | awk '{print $3}' || awk '/MemFree/ {print $2}' /proc/meminfo
textboxes:
  - title: Docker containers stats
    position: [[0, 29], [45, 10]]
    rate-ms: 500
    sample: which docker >/dev/null 2>&1 && docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}" || ps -eo pid,user,%cpu,%mem,comm --sort=-%cpu 2>/dev/null | head -n 6 || ps aux | head -n 6
  - title: Local weather
    position: [[69, 31], [13, 7]]
    rate-ms: 10000
    sample: curl -s wttr.in?0ATQF
    border: false
  - title: New York weather
    position: [[45, 31], [13, 7]]
    rate-ms: 10000
    sample: curl -s wttr.in/newyork?0ATQF
    transform: echo 1
    border: false
  - title: San Francisco weather
    position: [[56, 31], [13, 7]]
    rate-ms: 10000
    sample: curl -s wttr.in/sanfrancisco?0ATQF
    border: false
asciiboxes:
  - title: UTC time
    position: [[45, 12], [35, 7]]
    rate-ms: 500
    sample: env TZ=UTC date +%r
    border: false
    font: 3d
