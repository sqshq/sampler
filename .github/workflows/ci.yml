name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Verify module integrity
        run: go mod verify
      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
